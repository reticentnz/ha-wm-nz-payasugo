name: Bug report
description: Report a problem with the PayAsUGO integration
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Never attach a HAR file or include
        passwords, cookies, addresses, account identifiers, or Salesforce
        tokens.
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: "0.2.12"
    validations:
      required: true
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.7.0"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected and observed behaviour.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs
      description: Remove all personal information and authentication material.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am using the latest released version.
          required: true
        - label: I removed personal information and authentication material.
          required: true
